name: Feature request
description: Propose a user-facing improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the workflow or limitation, not just the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Focus and session lifecycle
        - History
        - Data and backup
        - Cross-device synchronization
        - Analytics
        - Accessibility and UI
        - PWA and platform support
    validations:
      required: true