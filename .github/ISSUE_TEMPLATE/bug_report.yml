name: Bug report
description: Report incorrect behavior or a regression in Still.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report reproducible behavior. Do not include private notes or exported session data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
      placeholder: The timer includes time while the session is paused.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session
        2. Pause it
        3. Reload the app
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 140, Chrome 152, Safari 19
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or additional context
      description: Remove personal information before sharing.